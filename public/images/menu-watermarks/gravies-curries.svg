<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#c4a365" stroke-linecap="round" stroke-linejoin="round">
  <!-- Kadai Base Pedestal -->
  <ellipse cx="100" cy="158" rx="42" ry="11" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.3"/>
  <!-- Traditional Indian Kadai / Wok Bowl -->
  <path d="M42 108 C42 152, 158 152, 158 108 Z" stroke-width="2.6" fill="#fcf8ee" fill-opacity="0.35"/>
  <!-- Kadai Upper Rolled Rim -->
  <ellipse cx="100" cy="108" rx="58" ry="15" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.5"/>
  <ellipse cx="100" cy="108" rx="50" ry="12" stroke-width="1.2"/>
  <!-- Simmering Curry Gravy Surface -->
  <ellipse cx="100" cy="110" rx="46" ry="10" stroke-width="1.4" fill="#c4a365" fill-opacity="0.18"/>
  <!-- Golden Cubes of Fresh Paneer / Vegetables floating in curry -->
  <polygon points="76,110 86,106 94,110 84,114" stroke-width="1.8" fill="#fcf8ee" fill-opacity="0.6"/>
  <polygon points="106,112 116,108 124,112 114,116" stroke-width="1.8" fill="#fcf8ee" fill-opacity="0.6"/>
  <polygon points="90,116 100,113 106,117 96,120" stroke-width="1.6" fill="#fcf8ee" fill-opacity="0.6"/>
  <!-- Fresh Coriander / Cilantro Herb Garnish -->
  <path d="M96 108 C90 102, 94 96, 100 100 C104 96, 110 102, 104 106 Z" stroke-width="1.6" fill="#153d2d" fill-opacity="0.4"/>
  <!-- Traditional Thick Wire Loop Handles (Left & Right) -->
  <circle cx="36" cy="104" r="11" stroke-width="2.4"/>
  <circle cx="164" cy="104" r="11" stroke-width="2.4"/>
  <!-- Simmering Bubble Accents -->
  <circle cx="70" cy="112" r="2.5" fill="#c4a365"/>
  <circle cx="128" cy="112" r="2" fill="#c4a365"/>
  <circle cx="118" cy="116" r="1.5" fill="#c4a365"/>
  <!-- Rich Aromatic Curry Steam -->
  <path d="M84 88 C80 74, 90 64, 84 50 C80 38, 88 30, 82 18" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M102 84 C98 68, 108 58, 102 42 C98 30, 106 22, 100 10" stroke-width="2.5"/>
  <path d="M120 88 C116 74, 126 64, 120 50 C116 38, 124 30, 118 18" stroke-width="2" stroke-dasharray="3 2"/>
</svg>
