<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#c4a365" stroke-linecap="round" stroke-linejoin="round">
  <!-- Fresh Banana Leaf Base Section -->
  <path d="M22 152 C42 168, 120 176, 178 142 C162 126, 142 110, 68 118 C46 122, 28 138, 22 152 Z" stroke-width="2.2" fill="#153d2d" fill-opacity="0.12"/>
