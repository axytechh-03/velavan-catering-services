<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#c4a365" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pedestal Base of Brass Uruli -->
  <ellipse cx="100" cy="162" rx="48" ry="12" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.3"/>
  <!-- Traditional Heavy Brass Uruli Body (Wide shallow bell-metal vessel) -->
  <path d="M34 116 C34 160, 166 160, 166 116 Z" stroke-width="2.8" fill="#fcf8ee" fill-opacity="0.4"/>
  <!-- Uruli Wide Flanged Rim -->
  <ellipse cx="100" cy="116" rx="66" ry="18" stroke-width="2.6" fill="#fcf8ee" fill-opacity="0.55"/>
  <ellipse cx="100" cy="116" rx="58" ry="14" stroke-width="1.4"/>
  <!-- Payasam Liquid Surface with Ghee Sheen -->
  <ellipse cx="100" cy="118" rx="52" ry="11" stroke-width="1.2" fill="#c4a365" fill-opacity="0.22"/>
  <!-- Roasted Cashews (Golden Curved Halves) floating in Payasam -->
  <path d="M74 118 C72 113, 80 111, 84 115 C82 119, 76 121, 74 118 Z" stroke-width="1.6" fill="#fcf8ee" fill-opacity="0.7"/>
  <path d="M120 120 C118 115, 126 113, 130 117 C128 121, 122 123, 120 120 Z" stroke-width="1.6" fill="#fcf8ee" fill-opacity="0.7"/>
  <path d="M96 122 C94 117, 102 115, 106 119 C104 123, 98 125, 96 122 Z" stroke-width="1.6" fill="#fcf8ee" fill-opacity="0.7"/>
  <!-- Golden Raisins (Kishmish) -->
  <ellipse cx="88" cy="119" rx="3.5" ry="2" transform="rotate(-15 88 119)" fill="#c4a365"/>
  <ellipse cx="112" cy="121" rx="3.5" ry="2" transform="rotate(20 112 121)" fill="#c4a365"/>
  <!-- Traditional Cast Brass Ring Handles (Left and Right) -->
  <path d="M34 114 C20 114, 20 126, 34 126" stroke-width="2.5"/>
  <path d="M166 114 C180 114, 180 126, 166 126" stroke-width="2.5"/>
  <!-- Elegant Brass Serving Ladle (Karandi) dipping into Payasam -->
  <path d="M136 122 L162 44" stroke-width="2.8"/>
  <ellipse cx="166" cy="40" rx="4" ry="2" stroke-width="2"/>
  <ellipse cx="132" cy="124" rx="14" ry="8" transform="rotate(-25 132 124)" stroke-width="2" fill="#c4a365" fill-opacity="0.3"/>
  <!-- Hot Sweet Cardamom Payasam Steam Vapors -->
  <path d="M80 94 C76 80, 86 70, 80 56 C76 44, 84 36, 78 22" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M100 90 C96 74, 106 64, 100 48 C96 36, 104 28, 98 14" stroke-width="2.5"/>
  <path d="M118 94 C114 80, 124 70, 118 56 C114 44, 122 36, 116 22" stroke-width="2" stroke-dasharray="3 2"/>
</svg>
