<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#c4a365" stroke-linecap="round" stroke-linejoin="round">
  <!-- Traditional Serving Plate / Thali Base -->
  <ellipse cx="100" cy="158" rx="78" ry="22" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.25"/>
  <ellipse cx="100" cy="158" rx="68" ry="17" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Steaming Mound of Pure Ghee Rice (Left Side) -->
  <path d="M42 152 C44 118, 102 118, 104 152 Z" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.5"/>
  <ellipse cx="73" cy="152" rx="31" ry="10" stroke-width="2" fill="#fcf8ee" fill-opacity="0.4"/>
  <!-- Grains of Rice texture -->
  <ellipse cx="66" cy="132" rx="4" ry="1.5" transform="rotate(25 66 132)" fill="#c4a365"/>
  <ellipse cx="80" cy="136" rx="4" ry="1.5" transform="rotate(-30 80 136)" fill="#c4a365"/>
  <ellipse cx="60" cy="142" rx="4" ry="1.5" transform="rotate(10 60 142)" fill="#c4a365"/>
  <ellipse cx="88" cy="144" rx="4" ry="1.5" transform="rotate(-15 88 144)" fill="#c4a365"/>
  <ellipse cx="74" cy="122" rx="4" ry="1.5" transform="rotate(45 74 122)" fill="#c4a365"/>
  <!-- Pure Cow Ghee crater on rice mound -->
  <ellipse cx="73" cy="124" rx="8" ry="4" stroke-width="1.5" fill="#c4a365" fill-opacity="0.3"/>
  <!-- Traditional South Indian Rasam Eeyachombu (Vessel - Right Side) -->
  <path d="M120 152 C116 138, 118 118, 126 104 L154 104 C162 118, 164 138, 160 152 Z" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.4"/>
  <ellipse cx="140" cy="152" rx="20" ry="8" stroke-width="2.2" fill="#fcf8ee" fill-opacity="0.3"/>
  <!-- Eeyachombu Flared Rim -->
  <ellipse cx="140" cy="104" rx="16" ry="6" stroke-width="2.2" fill="#fcf8ee" fill-opacity="0.55"/>
  <ellipse cx="140" cy="104" rx="12" ry="4" stroke-width="1.2"/>
