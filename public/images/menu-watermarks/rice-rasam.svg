  <path d="M123 124 C130 128, 150 128, 157 124" stroke-width="1.6"/>
  <path d="M121 136 C128 140, 152 140, 159 136" stroke-width="1.6"/>
  <!-- Coriander garnish on rasam -->
  <circle cx="140" cy="104" r="2" fill="#153d2d" fill-opacity="0.6"/>
  <!-- Fragrant Pepper-Cumin Rasam & Hot Rice Steam -->
  <path d="M68 112 C64 98, 72 90, 68 76 C64 64, 70 56, 66 44" stroke-width="2"/>
  <path d="M136 94 C132 80, 142 70, 136 56 C132 44, 140 36, 134 22" stroke-width="2.2"/>
  <path d="M148 96 C144 84, 150 76, 146 64" stroke-width="1.6" stroke-dasharray="2 2"/>
