<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#c4a365" stroke-linecap="round" stroke-linejoin="round">
  <!-- Woven Bread Basket / Thali -->
  <ellipse cx="95" cy="150" rx="76" ry="22" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.25"/>
  <ellipse cx="95" cy="150" rx="66" ry="17" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Layered Flaky Malabar / Bun Parotta (Spiral folds) -->
  <ellipse cx="74" cy="134" rx="36" ry="20" stroke-width="2.5" fill="#fcf8ee" fill-opacity="0.45"/>
  <!-- Parotta spiral layers -->
  <path d="M52 134 C58 124, 90 122, 96 132 C98 140, 80 148, 64 142 C56 138, 62 128, 76 130 C86 132, 84 138, 76 138" stroke-width="1.8"/>
  <ellipse cx="74" cy="130" rx="4" ry="2.5" fill="#c4a365" fill-opacity="0.4"/> <!-- Butter spot -->
  <!-- Tandoori Roti / Naan (Back-Right) with golden brown spots -->
  <path d="M96 126 C96 102, 138 98, 146 120 C150 134, 138 148, 116 146 C102 144, 96 136, 96 126 Z" stroke-width="2.4" fill="#fcf8ee" fill-opacity="0.4"/>
  <circle cx="118" cy="118" r="2.5" fill="#c4a365" fill-opacity="0.6"/>
  <circle cx="132" cy="126" r="2" fill="#c4a365" fill-opacity="0.6"/>
  <circle cx="126" cy="134" r="2.2" fill="#c4a365" fill-opacity="0.6"/>
  <circle cx="110" cy="130" r="1.8" fill="#c4a365" fill-opacity="0.6"/>
  <!-- Golden Wheat Sheaf Motif (Right side rising) -->
  <path d="M152 146 C162 120, 168 84, 160 52" stroke-width="2.2"/>
  <!-- Wheat grains on stalk -->
  <ellipse cx="156" cy="62" rx="4" ry="7" transform="rotate(-30 156 62)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="166" cy="68" rx="4" ry="7" transform="rotate(30 166 68)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="158" cy="80" rx="4.5" ry="8" transform="rotate(-30 158 80)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="168" cy="86" rx="4.5" ry="8" transform="rotate(30 168 86)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="160" cy="98" rx="4.5" ry="8" transform="rotate(-30 160 98)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="170" cy="104" rx="4.5" ry="8" transform="rotate(30 170 104)" stroke-width="1.8" fill="#c4a365" fill-opacity="0.35"/>
  <ellipse cx="162" cy="46" rx="3.5" ry="6" stroke-width="1.8" fill="#c4a365" fill-opacity="0.4"/>
  <!-- Fresh hot bread steam -->
  <path d="M68 108 C64 96, 72 88, 68 76 C64 66, 70 58, 66 48" stroke-width="1.8" stroke-dasharray="3 2"/>
  <path d="M86 102 C82 90, 90 82, 86 70" stroke-width="1.8" stroke-dasharray="2 2"/>
</svg>
